name: Deploy asset-editor to Dev

# Standalone deploy for the asset-editor, moved out of the ai-story-gen repo.
# Push to main -> lint -> build & push the single image to GHCR -> SSH to the
# dev VPS, reset this repo's server checkout, and `docker compose up`.

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: deploy-asset-editor
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/otabekeshpulatov/asset-editor-fabrolabs

jobs:
  build:
    # Two independent images from one checkout: the current editor and Asset
    # Studio. They share every backend layer, so the second build is mostly
    # cache hits — but they version and roll back separately.
    name: Build & push ${{ matrix.name }}
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: editor
            dockerfile: Dockerfile
            suffix: ''
          - name: asset-studio
            dockerfile: Dockerfile.v2
            suffix: '-v2'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE }}${{ matrix.suffix }}:dev
            ${{ env.IMAGE }}${{ matrix.suffix }}:${{ github.sha }}
          # Scope the cache per image so the two matrix legs do not evict each
          # other, while still sharing the identical backend layers.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to VPS
    needs: build
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          # Image tag (the just-built commit) + GHCR auth for VPS pulls.
          IMAGE_TAG: ${{ github.sha }}
          GHCR_PAT: ${{ secrets.GHCR_PAT }}
          GHCR_USER: ${{ vars.GHCR_USER || 'OtabekEshpulatov' }}
          # Storage the editor auto-connects to on startup (S3 / MinIO).
          MINIO_ENDPOINT_URL: ${{ vars.MINIO_ENDPOINT_URL }}
          MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
          MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
          MINIO_BUCKET: ${{ vars.MINIO_BUCKET }}
          # Host ports the two editors are published on.
          ASSET_EDITOR_PORT: ${{ vars.ASSET_EDITOR_PORT }}
          ASSET_EDITOR_V2_PORT: ${{ vars.ASSET_EDITOR_V2_PORT }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: IMAGE_TAG,GHCR_PAT,GHCR_USER,MINIO_ENDPOINT_URL,MINIO_ACCESS_KEY,MINIO_SECRET_KEY,MINIO_BUCKET,ASSET_EDITOR_PORT,ASSET_EDITOR_V2_PORT
          script: |
            set -e
            # Sync the server checkout BEFORE running deploy.sh: a git reset
            # inside the script would rewrite the file bash is executing mid-run.
            cd ${{ vars.ASSET_EDITOR_DIR || '/opt/asset-editor' }}
            git fetch origin main
            git reset --hard origin/main
            bash scripts/deploy.sh
